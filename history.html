.ghost{background:none}
.codes2{font:700 15px/1.9 'JetBrains Mono',monospace;direction:ltr;text-align:start;word-break:break-all}
.secret{font:700 14px/1.6 'JetBrains Mono',monospace;direction:ltr;text-align:start;word-break:break-all;padding:14px;border-radius:16px;background:var(--bg);box-shadow:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl)}
.empty{color:var(--mu);margin:0;padding:6px 0}
.chipbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
[hidden]{display:none!important}
.muted{color:var(--mu)}
.authwrap{min-height:calc(100vh - 120px);display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:30px 6vw 48px;max-width:1400px;margin:0 auto}
.authwrap .hero2{display:flex}
@media (max-width:900px){.authwrap{grid-template-columns:1fr;padding:24px 14px 40px;gap:20px}.authwrap .hero2{display:none}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:none}
.lk{color:var(--tx)}
.nav{color:var(--mu)}
.nav.on{color:var(--tx)}
#authshell{position:relative;z-index:1}

</style>
</head>

<div id="splash" aria-hidden="true"><div class="si"><div class="sl in"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M16 2l12 7v14l-12 7L4 23V9z"/><path d="M8 16c2.5-4 13.5-4 16 0-2.5 4-13.5 4-16 0z"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/></svg></div><div style="font:800 24px var(--fh)">Watcher<span style="color:var(--ac)">Osint</span></div></div></div>
<div id="root"></div>
<div id="toast" class="up" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">WatcherOsint needs JavaScript.</p></noscript>
<script src="/app.js" defer></script>
</body>
