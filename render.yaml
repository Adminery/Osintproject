services:
  - type: web
    name: watcherosint
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12
      - key: SECRET_KEY
        generateValue: true
      # Optional (fill in on the Render dashboard if you want them):
      - key: BREVO_API_KEY       # OTP emails over HTTPS (Render free blocks SMTP). Free tier: 300/day
        sync: false
      - key: MAIL_FROM          # e.g. WatcherOsint <you@gmail.com> (must be a verified sender in Brevo)
        sync: false
      - key: PUBLIC_URL         # e.g. https://watcherosint.onrender.com (OAuth callbacks)
        sync: false
      - key: DB_PATH
        value: /var/data/watcher.db   # only meaningful with a persistent disk (paid plan)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
